<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0f172a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Mohit Ojha Portfolio</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="images/about.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.06), rgba(118, 75, 162, 0.06)), #0f172a;
        }

        .error-wrapper {
            max-width: 500px;
        }

        .error-code {
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-icon {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 700;
            margin: 1rem 0 0.75rem;
            color: #f1f5f9;
        }

        p {
            color: #cbd5e1;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 26px rgba(102, 126, 234, 0.45);
        }

        .quick-links {
            margin-top: 2.5rem;
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .quick-links a:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="error-icon"><i class="fas fa-chart-line"></i></div>
        <div class="error-code">404</div>
        <h1>Oops! This page went missing from the dataset.</h1>
        <p>The page you're looking for doesn't exist or may have been moved. Let's get you back to the dashboard.</p>
        <a href="/" class="btn-home">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <div class="quick-links">
            <a href="/#about">About</a>
            <a href="/#projects">Projects</a>
            <a href="/#certifications">Certifications</a>
            <a href="/#contact">Contact</a>
        </div>
    </div>
</body>
</html>
